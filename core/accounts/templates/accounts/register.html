<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<style>
    body {
    background-color: rgba(0, 0, 0, 0.63)
    }
</style>
<body>
    <h1>Create an account</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Register</button>
    </form>

    <a href="{% url 'login' %}">Already have an account? Log in</a>
</body>
</html>
