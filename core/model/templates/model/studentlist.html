<!-- templates/user_list.html -->
<style>

.button {
     background-color: black;
    color: white;
    padding: 8px;
}
</style>

<h1>Students</h1>

<table ,border="1" cellpadding="8">
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Age</th>
      <th>Student ID</th>
      <th>Major</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    {% for student in students %}
      <tr>
        <td>{{ forloop.counter }}</td>
        <td>{{ student.name }}</td>
        <td>{{ student.email }}</td>
        <td>{{ student.age }}</td>
        <td>{{ student.student_id }}</td>
        <td>{{ student.major }}</td>
        <td>
          <form method="POST"
              action="{% url 'student_delete' student.id %}">
            {% csrf_token %}
            <button type="submit"
                onclick="return confirm('Delete this student?')">
              Delete
            </button>
          </form>
          <a class="button" href="{% url 'student_update' student.id %}">Update</a>
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>
